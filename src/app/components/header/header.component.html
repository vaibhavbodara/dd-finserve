<header class="app-header">
  <div class="header-container">
    <!-- Brand & Logo -->
    <div class="brand-section" routerLink="/dashboard">
      <div class="brand-logo-wrapper">
        <svg class="brand-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1e3a8a" />
              <stop offset="50%" stop-color="#2563eb" />
              <stop offset="100%" stop-color="#059669" />
            </linearGradient>
            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fbbf24" />
              <stop offset="50%" stop-color="#f59e0b" />
            </linearGradient>
          </defs>
          <!-- Hexagonal Shield Base -->
          <polygon points="50,6 90,26 90,74 50,94 10,74 10,26" fill="url(#shieldGrad)" rx="8" />
          <polygon points="50,11 85,28 85,72 50,89 15,72 15,28" fill="#0f172a" />
          <!-- Inner Gold Emblem -->
          <path d="M30 30 H 45 C 56 30 62 36 62 46 C 62 56 56 62 45 62 H 30 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
          <path d="M48 36 H 58 C 67 36 72 41 72 50 C 72 59 67 64 58 64 H 48" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" />
          <!-- Upward Growth Arrow -->
          <polyline points="40,55 52,43 64,48 76,34" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          <polygon points="73,34 76,34 76,37" fill="#34d399" />
        </svg>
      </div>

      <div class="brand-text">
        <div class="brand-name">
          <span class="brand-highlight">DD</span> FINSERVE
        </div>
      </div>
    </div>

    <!-- Navigation Options -->
    <nav class="nav-links">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
        <mat-icon class="nav-icon">dashboard</mat-icon>
        <span>Dashboard</span>
      </a>
      <a routerLink="/calculator" routerLinkActive="active" class="nav-item">
        <mat-icon class="nav-icon">calculate</mat-icon>
        <span>EMI Calculator</span>
      </a>
      <a routerLink="/customers" routerLinkActive="active" class="nav-item">
        <mat-icon class="nav-icon">people_alt</mat-icon>
        <span>Customer Details</span>
      </a>
    </nav>

    <!-- Right Header Actions -->
    <div class="header-actions">
      <!-- User Profile Dropdown Trigger -->
      <div
        class="user-profile-trigger"
        [matMenuTriggerFor]="userProfileMenu"
        [matTooltip]="profile.name + ' (' + profile.role + ')'"
      >
        <div class="user-avatar" [style.background]="profile.avatarColor || '#2563eb'">
          <span class="avatar-text">{{ initials }}</span>
          <span
            class="user-status-dot"
            [class.status-online]="profile.status === 'Online'"
            [class.status-field]="profile.status === 'On Field'"
            [class.status-away]="profile.status === 'Away'"
          ></span>
        </div>

        <div class="user-info-text">
          <span class="user-name">{{ profile.name }}</span>
          <span class="user-role">{{ profile.role }}</span>
        </div>

        <mat-icon class="profile-chevron">expand_more</mat-icon>
      </div>

      <!-- User Profile Material Menu -->
      <mat-menu #userProfileMenu="matMenu" class="custom-user-menu" xPosition="before">
        <!-- Profile Header in Dropdown -->
        <div class="menu-profile-card" (click)="$event.stopPropagation()">
          <div class="menu-avatar-large" [style.background]="profile.avatarColor || '#2563eb'">
            <span>{{ initials }}</span>
          </div>
          <div class="menu-user-details">
            <h4 class="menu-user-name">{{ profile.name }}</h4>
            <span class="menu-user-email">{{ profile.email }}</span>
            <div class="menu-badge-row">
              <span class="menu-emp-id">{{ profile.employeeId }}</span>
              <span class="menu-branch-tag">{{ profile.branch }}</span>
            </div>
          </div>
        </div>

        <!-- Quick Status Selector -->
        <div class="menu-status-bar" (click)="$event.stopPropagation()">
          <span class="status-bar-label">Current Status:</span>
          <div class="status-chips">
            <button
              type="button"
              class="status-chip chip-online"
              [class.chip-selected]="profile.status === 'Online'"
              (click)="setStatus('Online')"
            >
              <span class="dot-indicator dot-green"></span> Online
            </button>
            <button
              type="button"
              class="status-chip chip-field"
              [class.chip-selected]="profile.status === 'On Field'"
              (click)="setStatus('On Field')"
            >
              <span class="dot-indicator dot-blue"></span> On Field
            </button>
            <button
              type="button"
              class="status-chip chip-away"
              [class.chip-selected]="profile.status === 'Away'"
              (click)="setStatus('Away')"
            >
              <span class="dot-indicator dot-amber"></span> Away
            </button>
          </div>
        </div>

        <mat-divider></mat-divider>

        <!-- Menu Action Options -->
        <button mat-menu-item (click)="openProfileDialog()">
          <mat-icon class="menu-action-icon text-blue">manage_accounts</mat-icon>
          <span>My Profile & Settings</span>
        </button>

        <button mat-menu-item (click)="openProfileDialog()">
          <mat-icon class="menu-action-icon text-emerald">storefront</mat-icon>
          <span>Branch: {{ profile.branch }}</span>
        </button>

        <button mat-menu-item (click)="openProfileDialog()">
          <mat-icon class="menu-action-icon text-amber">track_changes</mat-icon>
          <span>Daily Target: ₹{{ profile.dailyTarget | number }}</span>
        </button>

        <mat-divider></mat-divider>

        <button mat-menu-item (click)="logout()" class="logout-menu-item">
          <mat-icon class="menu-action-icon text-rose">lock</mat-icon>
          <span>Lock / Sign Out</span>
        </button>
      </mat-menu>

    </div>
  </div>
</header>
