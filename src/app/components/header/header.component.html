<header class="app-header">
  <div class="header-container">
    <!-- Brand & Logo -->
    <div class="brand-section" routerLink="/">
      <div class="brand-logo-wrapper">
        <svg class="brand-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#1e3a8a" />
              <stop offset="50%" stop-color="#2563eb" />
              <stop offset="100%" stop-color="#059669" />
            </linearGradient>
            <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fbbf24" />
              <stop offset="100%" stop-color="#f59e0b" />
            </linearGradient>
          </defs>
          <!-- Hexagonal Shield Base -->
          <polygon points="50,6 90,26 90,74 50,94 10,74 10,26" fill="url(#shieldGrad)" rx="8" />
          <polygon points="50,11 85,28 85,72 50,89 15,72 15,28" fill="#0f172a" />
          <!-- Inner Gold Emblem -->
          <path d="M30 30 H 45 C 56 30 62 36 62 46 C 62 56 56 62 45 62 H 30 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linecap="round" />
          <path d="M48 36 H 58 C 67 36 72 41 72 50 C 72 59 67 64 58 64 H 48" fill="none" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" />
          <!-- Upward Growth Arrow -->
          <polyline points="40,55 52,43 64,48 76,34" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          <polygon points="73,34 76,34 76,37" fill="#34d399" />
        </svg>
      </div>

      <div class="brand-text">
        <div class="brand-name">
          <span class="brand-highlight">DD</span> FINSERVE
        </div>
        <div class="brand-tagline">DAILY EMI & MICROFINANCE</div>
      </div>
    </div>

    <!-- Navigation Options -->
    <nav class="nav-links">
      <a routerLink="/customers" routerLinkActive="active" class="nav-item">
        <mat-icon class="nav-icon">people_alt</mat-icon>
        <span>Customer Details</span>
      </a>
    </nav>

    <!-- Right Header Actions -->
    <div class="header-actions">
      <!-- Status Indicator -->
      <div class="system-status" [title]="backendOnline ? 'Backend Online (MongoDB: ' + databaseStatus + ')' : 'Using Local Storage Mode'">
        <span class="status-dot" [class.online]="backendOnline"></span>
        <span class="status-text">{{ backendOnline ? 'API Connected' : 'Local Storage Mode' }}</span>
      </div>

      <!-- Add Customer Action Button -->
      <button mat-raised-button color="primary" class="add-customer-btn" (click)="onAddCustomer()">
        <mat-icon>person_add</mat-icon>
        <span>Add Customer</span>
      </button>
    </div>
  </div>
</header>
