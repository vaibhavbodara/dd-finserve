<div class="app-layout" [class.no-chrome-layout]="isLoginPage">
  @if (!isLoginPage) {
    <app-header (addCustomerClicked)="openAddCustomer()"></app-header>
  }
  <main class="main-content" [class.login-content]="isLoginPage">
    <router-outlet></router-outlet>
  </main>
  @if (!isLoginPage) {
    <app-footer></app-footer>
  }
</div>
